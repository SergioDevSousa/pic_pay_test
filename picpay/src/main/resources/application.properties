spring.application.name=picpay

spring.datasource.url=jdbc:h2:mem:picpaydb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true

# Mostrar o SQL no console
spring.jpa.show-sql=true


# Criar ou atualizar o banco de dados automaticamente
spring.jpa.hibernate.ddl-auto=update

picpay.authorization.url=https://util.devi.tools/api/v2/authorize
picpay.notification.url=https://util.devi.tools/api/v1/notify
